version: '3.8'

services:
  mongodb:
    build:
      context: ./database
      dockerfile: Dockerfile.mongodb
    image: civicpulse/mongodb:v1
    container_name: civicpulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - civicpulse-network
    env_file:
      - ./backend/.env
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: civicpulse/backend:v1
    container_name: civicpulse-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend-logs:/app/logs
    command: npm run dev
    environment:
      - NODE_ENV=development
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - civicpulse-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: builder
    image: civicpulse/frontend-dev:v1
    container_name: civicpulse-frontend
    restart: unless-stopped
    command: npm start -- --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civicpulse-network
    # Use different healthcheck for Angular dev server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4200/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.nginx
    image: civicpulse/nginx
    container_name: civicpulse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - nginx-cache:/var/cache/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - civicpulse-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongodb-data:
  backend-logs:
  nginx-cache:

networks:
  civicpulse-network:
    driver: bridge
